{% extends "base.html" %}

{% block title %}Предметы — Электронный журнал{% endblock %}

{% block content %}

<div class="page-heading">
    <div><h1>Предметы</h1><p>Дисциплины, по которым ставятся оценки.</p></div>
    <button id="add-record" class="button-primary">
        Добавить предмет
    </button>
</div>

<p id="status" class="status" role="status" aria-live="polite" hidden></p>

<section id="editor" class="editor" hidden>
    <h2 id="editor-title">Предмет</h2>

    <form id="edit-form">
        <input id="record-id" type="hidden">

        <div class="form-fields">
            <label>
                Название предмета
                <input id="record-name" type="text" required>
            </label>
        </div>

        <div class="button-row">
            <button class="button-primary" type="submit">
                Сохранить
            </button>

            <button id="cancel-edit" type="button">
                Отмена
            </button>
        </div>
    </form>
</section>

<section id="confirmation" class="confirmation" aria-label="Подтверждение удаления" hidden>
    <p id="confirmation-text"></p>

    <div class="button-row">
        <button id="confirm-delete" class="button-danger">
            Удалить
        </button>

        <button id="cancel-delete">
            Отмена
        </button>
    </div>
</section>

<div class="table-scroll">
    <table>
        <thead>
            <tr>
                <th>Название предмета</th>
                <th>Действия</th>
            </tr>
        </thead>

        <tbody id="table-body"></tbody>
    </table>
</div>

{% endblock %}

{% block scripts %}
<script type="module"
src="{{ url_for('subjects.static', filename='subjects.js') }}">
</script>
{% endblock %}
