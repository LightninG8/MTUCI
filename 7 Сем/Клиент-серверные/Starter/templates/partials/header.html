<header class="site-header">
  <div class="container header-row">
    <a class="brand" href="{{ url_for('groups.index') }}">
      <span class="brand-mark" aria-hidden="true">Ж</span>
      <span>Электронный журнал</span>
    </a>
    <nav class="navigation" aria-label="Разделы приложения">
    {% for key, label in [
        ('groups', 'Группы'),
        ('subjects', 'Предметы'),
        ('students', 'Студенты'),
        ('journal', 'Журнал'),
        ('reports', 'Отчёты')
    ] %}
      <a href="{{ url_for(key + '.index') }}"{% if active_page == key %} aria-current="page"{% endif %}>{{ label }}</a>
    {% endfor %}
    </nav>
  </div>
</header>
